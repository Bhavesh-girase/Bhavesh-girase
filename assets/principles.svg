<svg xmlns="http://www.w3.org/2000/svg" width="880" height="206" viewBox="0 0 880 206" role="img">
<defs></defs>
<rect width="880" height="206" rx="18" fill="#0b1324"/><rect x=".75" y=".75" width="878.5" height="204.5" rx="17.5" fill="none" stroke="#1e2d4d" stroke-width="1.5"/><text x="30.0" y="42" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="2" fill="#fbbf24">PRINCIPLE 01</text><text x="30.0" y="72" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">Deterministic first,</text><text x="30.0" y="97" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">LLM second.</text><rect x="30.0" y="128" width="28" height="3" rx="1.5" fill="#fbbf24"/><text x="30.0" y="152" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a9b6cf">Solvers and rules make the call;</text><text x="30.0" y="170" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a9b6cf">models draft, explain and assist,</text><text x="30.0" y="188" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a9b6cf">but never get the final word.</text><line x1="293.3333333333333" y1="28" x2="293.3333333333333" y2="178" stroke="#1e2d4d"/><text x="323.3333333333333" y="42" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="2" fill="#34d399">PRINCIPLE 02</text><text x="323.3333333333333" y="72" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">Privacy by</text><text x="323.3333333333333" y="97" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">architecture.</text><rect x="323.3333333333333" y="128" width="28" height="3" rx="1.5" fill="#34d399"/><text x="323.3333333333333" y="152" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a9b6cf">Handle sensitive data where it lives.</text><text x="323.3333333333333" y="170" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a9b6cf">Make leaks structurally impossible,</text><text x="323.3333333333333" y="188" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a9b6cf">not just against the rules.</text><line x1="586.6666666666666" y1="28" x2="586.6666666666666" y2="178" stroke="#1e2d4d"/><text x="616.6666666666666" y="42" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="2" fill="#38bdf8">PRINCIPLE 03</text><text x="616.6666666666666" y="72" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">Measure,</text><text x="616.6666666666666" y="97" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">then claim.</text><rect x="616.6666666666666" y="128" width="28" height="3" rx="1.5" fill="#38bdf8"/><text x="616.6666666666666" y="152" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a9b6cf">Every headline number comes from a</text><text x="616.6666666666666" y="170" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a9b6cf">benchmark, load test or test suite,</text><text x="616.6666666666666" y="188" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a9b6cf">so anyone can re-run it.</text>
</svg>
